# Wiki — docs lint and site build.
#
# Deliberately self-contained: does NOT depend on the host repo's toolchain. The
# lint job needs only Node on PATH (npx fetches wiki-kit itself); the build job
# needs npm inside wiki/. That's why this file works the same in a Go, PHP, or
# Python repo — and why it's a separate workflow, not a job inside the main CI.

name: wiki

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only needs Node on PATH: wiki-kit itself uses only the stdlib, and npx
  # fetches it on demand — no local npm install, no node_modules, in this repo.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The staleness gate and `--affected` compare commits: a shallow
          # clone doesn't have the history for that.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Wiki lint
        run: make -C wiki lint

      # Gate: code changed and the page declaring it as a source didn't.
      # PR only — a direct push to main has no base to compare against.
      - name: Docs in sync with the code
        if: github.event_name == 'pull_request'
        # The base is resolved automatically from GITHUB_BASE_REF — wiki-kit
        # knows the env vars for GitHub Actions, Jenkins, GitLab, and
        # Bitbucket, so the same command works in any CI.
        run: npx -y @glauberborges/wiki-kit affected --strict

  # Costs an `npm ci` — runs only when the wiki changes. This is where
  # Docusaurus's `onBrokenLinks: 'throw'` actually fails the build.
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install site dependencies
        run: npm --prefix wiki ci --no-audit --no-fund

      - name: Generate the LLM layer
        run: npx -y @glauberborges/wiki-kit llms

      - name: Build the site
        run: npm --prefix wiki run build

      - uses: actions/upload-artifact@v4
        with:
          name: wiki-site
          path: wiki/build/
          retention-days: 7

